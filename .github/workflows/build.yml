name: build

on:
  workflow_call:
    outputs:
      image_selected:
        value: ${{ jobs.image.outputs.image_selected }}
      publish_selected:
        value: ${{ jobs.image.outputs.publish_selected }}
      artifact_id:
        value: ${{ jobs.image.outputs.artifact_id }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
      image_selected: ${{ steps.scope.outputs.image }}
      publish_selected: ${{ steps.scope.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-scope.sh
      - name: Install image transfer tool
        if: steps.scope.outputs.image == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true' || github.repository != 'chrisbennight/mcp-gitea-rs')
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Authenticate read-only registry access
        if: (steps.scope.outputs.image == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true' || github.repository != 'chrisbennight/mcp-gitea-rs')) && (github.event_name == 'push' && github.repository == 'chrisbennight/mcp-gitea-rs')
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Prepare image artifact
        if: steps.scope.outputs.image == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true' || github.repository != 'chrisbennight/mcp-gitea-rs')
        id: candidate
        run: python3 scripts/image_artifact.py prepare "$RUNNER_TEMP/validated-image"

      - name: Smoke health endpoint
        if: steps.scope.outputs.image == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true' || github.repository != 'chrisbennight/mcp-gitea-rs')
        env:
          TEST_IMAGE: ${{ steps.candidate.outputs.image }}
        run: scripts/smoke-image.sh "$TEST_IMAGE" "mcp-gitea-rs-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Check independent MCP clients
        if: steps.scope.outputs.image == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true' || github.repository != 'chrisbennight/mcp-gitea-rs')
        env:
          TEST_IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mcp-python-client"
          "$RUNNER_TEMP/mcp-python-client/bin/pip" install 'mcp==2.2.0'
          npm install --prefix "$RUNNER_TEMP/mcp-typescript-client" --ignore-scripts \
            --no-audit --no-fund '@modelcontextprotocol/sdk@1.30.0'
          cp scripts/compatibility/typescript.mjs "$RUNNER_TEMP/mcp-typescript-client/"
          "$RUNNER_TEMP/mcp-python-client/bin/python" scripts/compatibility/run.py \
            "$TEST_IMAGE" \
            --typescript-client "$RUNNER_TEMP/mcp-typescript-client/typescript.mjs"

      - name: Record validated identity
        if: steps.scope.outputs.image == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true' || github.repository != 'chrisbennight/mcp-gitea-rs')
        run: python3 scripts/image_artifact.py record "$RUNNER_TEMP/validated-image"

      - name: Retain tested artifact
        if: steps.scope.outputs.image == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true' || github.repository != 'chrisbennight/mcp-gitea-rs')
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/validated-image/image.oci.tar
            ${{ runner.temp }}/validated-image/validated.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Remove qualified local image
        if: always()
        env:
          CANDIDATE_TAG: ${{ steps.candidate.outputs.candidate_tag }}
        run: |
          if [[ -n "$CANDIDATE_TAG" ]]; then docker image rm "$CANDIDATE_TAG"; fi

      - name: Remove registry credentials
        if: (steps.scope.outputs.image == 'true' && (github.event_name != 'push' || steps.scope.outputs.publish != 'true' || github.repository != 'chrisbennight/mcp-gitea-rs')) && (always() && github.event_name == 'push' && github.repository == 'chrisbennight/mcp-gitea-rs')
        run: skopeo logout ghcr.io
