name: build

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        run: python3 scripts/release_version.py

      - name: Build image
        env:
          IMAGE: ghcr.io/chrisbennight/mcp-gitea-rs
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA}" .

      - name: Verify image architecture
        env:
          IMAGE: ghcr.io/chrisbennight/mcp-gitea-rs
        run: |
          set -euo pipefail
          architecture="$(docker image inspect --format '{{.Architecture}}' "${IMAGE}:sha-${GITHUB_SHA}")"
          test "$architecture" = amd64

      - name: Smoke health endpoint
        env:
          IMAGE: ghcr.io/chrisbennight/mcp-gitea-rs
        run: |
          set -euo pipefail
          scripts/smoke-image.sh \
            "${IMAGE}:sha-${GITHUB_SHA}" \
            "mcp-gitea-rs-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Check independent MCP clients
        if: ${{ !inputs.publish }}
        env:
          IMAGE: ghcr.io/chrisbennight/mcp-gitea-rs
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mcp-python-client"
          "$RUNNER_TEMP/mcp-python-client/bin/pip" install 'mcp==2.2.0'
          npm install --prefix "$RUNNER_TEMP/mcp-typescript-client" --ignore-scripts \
            --no-audit --no-fund '@modelcontextprotocol/sdk@1.30.0'
          cp scripts/compatibility/typescript.mjs "$RUNNER_TEMP/mcp-typescript-client/"
          "$RUNNER_TEMP/mcp-python-client/bin/python" scripts/compatibility/run.py \
            "${IMAGE}:sha-${GITHUB_SHA}" \
            --typescript-client "$RUNNER_TEMP/mcp-typescript-client/typescript.mjs"

      - name: Publish image
        if: inputs.publish
        env:
          IMAGE: ghcr.io/chrisbennight/mcp-gitea-rs
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_tag=$(python3 scripts/release_version.py)
          trap 'docker logout ghcr.io >/dev/null' EXIT
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io \
            --username "$REGISTRY_USER" --password-stdin
          revision="${IMAGE}:sha-${GITHUB_SHA}"
          revision_created=0
          if inspection=$(docker manifest inspect "$revision" 2>&1); then
            echo "immutable revision already exists; refusing to rebind it"
          elif [ "$inspection" = "manifest unknown" ] \
            || [ "$inspection" = "no such manifest: $revision" ]; then
            docker push "$revision"
            revision_created=1
          else
            printf 'failed to determine whether immutable revision exists: %s\n' \
              "$inspection" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$revision_created" = 0 ]; then
              docker pull "$revision"
              scripts/smoke-image.sh \
                "$revision" \
                "mcp-gitea-rs-remote-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            fi
            docker buildx imagetools create --prefer-index=false \
              --tag "${IMAGE}:latest" "$revision"
          fi
          if [ -n "$release_tag" ]; then
            release="${IMAGE}:${release_tag}"
            if release_manifest=$(docker manifest inspect "$release" 2>&1); then
              revision_manifest=$(docker manifest inspect "$revision")
              if [ "$release_manifest" != "$revision_manifest" ]; then
                echo "release tag already names different image contents" >&2
                exit 1
              fi
            elif [ "$release_manifest" = "manifest unknown" ] \
              || [ "$release_manifest" = "no such manifest: $release" ]; then
              docker buildx imagetools create --prefer-index=false --tag "$release" "$revision"
            else
              printf 'failed to inspect release tag: %s\n' "$release_manifest" >&2
              exit 1
            fi
          fi
