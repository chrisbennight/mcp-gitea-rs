name: build

on:
  workflow_call:
    outputs:
      artifact_id:
        value: ${{ jobs.image.outputs.artifact_id }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    outputs:
      artifact_id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install image transfer tool
        run: sudo apt-get update && sudo apt-get install -y skopeo

      - name: Authenticate read-only registry access
        if: github.event_name == 'push' && github.repository == 'chrisbennight/mcp-gitea-rs'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Prepare image artifact
        id: candidate
        run: python3 scripts/image_artifact.py prepare "$RUNNER_TEMP/validated-image"

      - name: Smoke health endpoint
        env:
          TEST_IMAGE: ${{ steps.candidate.outputs.image }}
        run: scripts/smoke-image.sh "$TEST_IMAGE" "mcp-gitea-rs-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Check independent MCP clients
        env:
          TEST_IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mcp-python-client"
          "$RUNNER_TEMP/mcp-python-client/bin/pip" install 'mcp==2.2.0'
          npm install --prefix "$RUNNER_TEMP/mcp-typescript-client" --ignore-scripts \
            --no-audit --no-fund '@modelcontextprotocol/sdk@1.30.0'
          cp scripts/compatibility/typescript.mjs "$RUNNER_TEMP/mcp-typescript-client/"
          "$RUNNER_TEMP/mcp-python-client/bin/python" scripts/compatibility/run.py \
            "$TEST_IMAGE" \
            --typescript-client "$RUNNER_TEMP/mcp-typescript-client/typescript.mjs"

      - name: Record validated identity
        run: python3 scripts/image_artifact.py record "$RUNNER_TEMP/validated-image"

      - name: Retain tested artifact
        id: archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validated-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/validated-image/image.oci.tar
            ${{ runner.temp }}/validated-image/validated.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Clean up image builder
        if: always()
        run: |
          if docker buildx inspect artifact-builder >/dev/null 2>&1; then
            docker buildx rm artifact-builder
          fi

      - name: Remove registry credentials
        if: always() && github.event_name == 'push' && github.repository == 'chrisbennight/mcp-gitea-rs'
        run: skopeo logout ghcr.io
