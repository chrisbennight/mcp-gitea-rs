name: test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUST_TOOLCHAIN_VERSION: "1.96.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed components
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-scope.sh
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        if: steps.scope.outputs.rust == 'true' || steps.scope.outputs.integration == 'true'
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy
      - if: steps.scope.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - if: steps.scope.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - if: steps.scope.outputs.rust == 'true'
        run: cargo test --workspace --all-features --locked
      - if: steps.scope.outputs.integration == 'true'
        run: bash scripts/test_token_scope.sh
      - if: steps.scope.outputs.integration == 'true'
        run: bash scripts/test_bootstrap.sh
      - if: steps.scope.outputs.rust == 'true'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked
      - if: steps.scope.outputs.docs == 'true'
        run: python3 scripts/check_docs.py
      - if: steps.scope.outputs.catalog == 'true'
        run: python3 scripts/generate_api.py --check
      - if: steps.scope.outputs.python == 'true'
        run: python3 -m unittest discover -s scripts/tests
