name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_id || 'mcp-gitea-rs-image-publication' }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  image:
    needs: test
    uses: ./.github/workflows/build.yml

  publish:
    needs: [test, image]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'chrisbennight/mcp-gitea-rs'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build.yml
    with:
      publish: true
