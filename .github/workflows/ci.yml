name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  advisories:
    uses: ./.github/workflows/security.yml

  test:
    uses: ./.github/workflows/test.yml

  image:
    needs: test
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build.yml

  publish:
    needs: [test, image, advisories]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'chrisbennight/mcp-gitea-rs' && needs.image.outputs.publish_selected == 'true'
    concurrency:
      group: mcp-gitea-rs-image-publication
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install image transfer tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Authenticate registry access
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Prepare image artifact
        id: candidate
        run: python3 scripts/image_artifact.py prepare "$RUNNER_TEMP/validated-image"

      - name: Smoke health endpoint
        env:
          TEST_IMAGE: ${{ steps.candidate.outputs.image }}
        run: scripts/smoke-image.sh "$TEST_IMAGE" "mcp-gitea-rs-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Check independent MCP clients
        env:
          TEST_IMAGE: ${{ steps.candidate.outputs.image }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mcp-python-client"
          "$RUNNER_TEMP/mcp-python-client/bin/pip" install 'mcp==2.2.0'
          npm install --prefix "$RUNNER_TEMP/mcp-typescript-client" --ignore-scripts \
            --no-audit --no-fund '@modelcontextprotocol/sdk@1.30.0'
          cp scripts/compatibility/typescript.mjs "$RUNNER_TEMP/mcp-typescript-client/"
          "$RUNNER_TEMP/mcp-python-client/bin/python" scripts/compatibility/run.py \
            "$TEST_IMAGE" \
            --typescript-client "$RUNNER_TEMP/mcp-typescript-client/typescript.mjs"

      - name: Record validated identity
        run: python3 scripts/image_artifact.py record "$RUNNER_TEMP/validated-image"

      - name: Verify publication evidence
        run: python3 scripts/image_artifact.py verify "$RUNNER_TEMP/validated-image"
      - name: Read current main for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .ci/publication-main
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck publication inputs against current main
        id: release_scope
        run: |
          set -euo pipefail
          current=true
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            qualified_root="$PWD"
            cd .ci/publication-main
            git cat-file -e "$GITHUB_SHA^{commit}"
            current=false
            if git merge-base --is-ancestor "$GITHUB_SHA" HEAD; then
              scope_file=$(mktemp)
              trap 'rm -f "$scope_file"' EXIT
              GITHUB_EVENT_NAME=push BASE_SHA="$GITHUB_SHA" GITHUB_OUTPUT="$scope_file" \
                bash "$qualified_root/scripts/ci-scope.sh"
              if grep -Fxq 'publish=false' "$scope_file"; then current=true; fi
            fi
          fi
          printf 'current=%s\n' "$current" >> "$GITHUB_OUTPUT"
          if [[ "$current" == false ]]; then echo 'SKIP: newer main changes application inputs'; fi

      - name: Publish tested artifact
        if: (true) && steps.release_scope.outputs.current == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          python3 scripts/image_artifact.py publish "$RUNNER_TEMP/validated-image"
      - name: Remove qualified local image
        if: always()
        env:
          CANDIDATE_TAG: ${{ steps.candidate.outputs.candidate_tag }}
        run: |
          if [[ -n "$CANDIDATE_TAG" ]]; then docker image rm "$CANDIDATE_TAG"; fi
      - name: Remove registry credentials
        if: always()
        run: skopeo logout ghcr.io
