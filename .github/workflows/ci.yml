name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_id || 'mcp-gitea-rs-image-publication' }}
  cancel-in-progress: false

jobs:
  advisories:
    uses: ./.github/workflows/security.yml

  test:
    uses: ./.github/workflows/test.yml

  image:
    needs: test
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/build.yml

  publish:
    needs: [test, image, advisories]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.repository == 'chrisbennight/mcp-gitea-rs'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.image.outputs.artifact_id }}
          path: ${{ runner.temp }}/validated-image
          merge-multiple: true
      - name: Install image transfer tool
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Verify publication evidence
        run: python3 scripts/image_artifact.py verify "$RUNNER_TEMP/validated-image"
      - name: Publish tested artifact
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          set -euo pipefail
          trap 'skopeo logout ghcr.io >/dev/null' EXIT
          printf '%s' "$REGISTRY_TOKEN" | skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin
          python3 scripts/image_artifact.py publish "$RUNNER_TEMP/validated-image"
