[workspace]
resolver = "3"
members = [
    "crates/gitea-api",
    "crates/gitea-mcp",
    "crates/gitea-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/chrisbennight/mcp-gitea-rs"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "=0.22.1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
getrandom = "0.4"
http = "1"
gitea-api = { path = "crates/gitea-api" }
gitea-mcp = { path = "crates/gitea-mcp" }
jsonschema = { version = "=0.49.0", default-features = false }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "query", "rustls"] }
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["limit", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
